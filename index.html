<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>夜市吃貨小精靈 - 台灣美食探險</title>
    <style>
        :root {
            --neon-pink: #ff2a6d;
            --neon-blue: #05d9e8;
            --neon-yellow: #ffc400;
            --neon-green: #00ff66;
            --bg-color: #111111;
            --text-color: #ffffff;
            --game-size: min(94vw, calc(100vh - 90px));
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            background-color: #111111 !important;
            color: #ffffff !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            touch-action: manipulation;
        }

        button, input, select {
            touch-action: manipulation !important;
            cursor: pointer;
            font-family: inherit;
            pointer-events: auto !important;
            user-select: auto !important;
            -webkit-user-select: auto !important;
        }

        /* HUD 狀態列 */
        #hud {
            width: var(--game-size);
            display: flex;
            justify-content: space-between;
            padding: clamp(8px, 1.4vh, 14px) clamp(12px, 2vw, 22px);
            background: rgba(0,0,0,0.9) !important;
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px var(--neon-blue);
            font-weight: bold;
            font-size: clamp(16px, 2.5vmin, 23px);
        }
        
        .hud-item { display: flex; align-items: center; }
        #lives { color: var(--neon-pink); letter-spacing: 2px; }

        /* 遊戲畫布容器 */
        #game-container {
            position: relative;
            box-shadow: 0 0 25px var(--neon-pink);
            border-radius: 10px;
            overflow: hidden;
            background-color: #000000 !important;
            width: var(--game-size);
            height: var(--game-size);
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            touch-action: none;
            background-color: #050505;
        }

        .hidden { 
            display: none !important; 
            pointer-events: none !important;
        }

        /* 介面彈窗遮罩 */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 17, 17, 0.96) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 2.8vmin, 24px);
            text-align: center;
            z-index: 30;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            pointer-events: auto;
        }

        .modal h1 {
            color: var(--neon-yellow) !important;
            text-shadow: 0 0 14px var(--neon-yellow);
            margin-bottom: clamp(10px, 2vmin, 18px);
            font-size: clamp(24px, 4.6vmin, 36px);
        }

        .modal h2#quiz-title {
            color: var(--neon-yellow) !important;
            font-size: clamp(14px, 2.2vmin, 17px) !important;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        .modal p { 
            color: #ffffff !important;
            margin-bottom: 10px; 
            line-height: 1.45; 
            font-size: clamp(16px, 2.5vmin, 21px);
        }

        #quiz-question {
            font-size: clamp(20px, 3.4vmin, 28px) !important;
            font-weight: bold !important;
            color: var(--neon-blue) !important;
            margin: 8px 0 12px !important;
            line-height: 1.35 !important;
            text-shadow: 0 0 10px rgba(5, 217, 232, 0.4);
        }

        /* 霓虹按鈕 */
        .btn {
            background: #111111;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: clamp(10px, 1.6vmin, 14px) clamp(18px, 3vmin, 32px);
            font-size: clamp(15px, 2.4vmin, 20px);
            border-radius: 24px;
            font-weight: bold;
            margin: 5px;
            box-shadow: 0 0 5px var(--neon-blue) inset, 0 0 5px var(--neon-blue);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:active {
            background: var(--neon-blue) !important;
            color: #000000 !important;
        }
        .btn-green {
            color: var(--neon-green) !important;
            border-color: var(--neon-green) !important;
            box-shadow: 0 0 5px var(--neon-green) inset, 0 0 5px var(--neon-green);
        }
        .btn-green:active {
            background: var(--neon-green) !important;
            color: #000000 !important;
        }
        .btn-danger {
            color: var(--neon-pink) !important;
            border-color: var(--neon-pink) !important;
            box-shadow: 0 0 5px var(--neon-pink) inset, 0 0 5px var(--neon-pink);
        }
        .btn-danger:active {
            background: var(--neon-pink) !important;
            color: #ffffff !important;
        }

        #player-name-input {
            padding: clamp(10px, 1.8vmin, 16px);
            font-size: clamp(17px, 2.8vmin, 22px);
            border-radius: 8px;
            border: 2px solid var(--neon-pink);
            background: #222222;
            color: #ffffff;
            text-align: center;
            margin-bottom: clamp(12px, 2.2vmin, 20px);
            width: 80%;
            max-width: 320px;
        }

        #quiz-q-img {
            max-height: clamp(90px, 22vmin, 160px);
            max-width: min(85%, 260px);
            width: auto;
            object-fit: contain;
            margin: 6px auto 10px;
            border-radius: 8px;
            border: 2px solid var(--neon-blue);
            background: rgba(0,0,0,0.6);
            padding: 4px;
            box-shadow: 0 0 12px var(--neon-blue);
            display: block;
        }

        /* 選項按鈕區 */
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 95%;
            max-width: 460px;
            gap: clamp(8px, 1.5vmin, 12px);
        }
        @media (max-width: 380px) {
            .quiz-options { grid-template-columns: 1fr; }
        }
        .quiz-btn {
            border-color: var(--neon-pink);
            color: #ffffff;
            box-shadow: 0 0 5px var(--neon-pink) inset;
            padding: clamp(12px, 1.8vmin, 16px) clamp(10px, 1.4vmin, 14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            min-height: 60px;
        }
        .quiz-btn:active {
            background: rgba(255, 42, 109, 0.4) !important;
            border-color: var(--neon-yellow) !important;
        }

        .quiz-opt-text {
            width: 100%;
            white-space: normal;
            word-break: break-word;
            line-height: 1.35;
            font-weight: bold;
            font-size: clamp(18px, 2.9vmin, 23px) !important;
        }

        .quiz-opt-img {
            width: clamp(48px, 9vmin, 68px);
            height: clamp(48px, 9vmin, 68px);
            border-radius: 6px;
            object-fit: cover;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            flex-shrink: 0;
        }

        /* 題庫編輯器樣式 */
        #editor-screen {
            justify-content: flex-start;
            text-align: left;
            padding: 12px;
        }
        .editor-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-blue);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .settings-bar {
            width: 100%;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--neon-blue);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .setting-item label {
            color: var(--neon-yellow);
            font-weight: bold;
        }
        .editor-select {
            background: #222222;
            color: #ffffff;
            border: 1px solid #666666;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .editor-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(var(--game-size) - 190px);
            padding-right: 4px;
        }
        .quiz-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .quiz-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--neon-yellow);
            font-weight: bold;
        }
        .editor-input {
            width: 100%;
            background: #222222;
            border: 1px solid #555555;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 14px;
            border-radius: 4px;
            outline: none;
        }
        .opt-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .opt-preview {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid #666666;
            object-fit: contain;
            background: #111111;
            flex-shrink: 0;
        }
        .upload-btn-label {
            background: #333333;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 5px 9px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .upload-btn-label:hover, .upload-btn-label:active {
            background: var(--neon-blue);
            color: #000000;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-item">👤 <span id="display-name">玩家</span></div>
        <div class="hud-item">🏆 分數: <span id="score">0</span></div>
        <div class="hud-item" id="lives">❤️❤️❤️</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="380" height="380"></canvas>

        <!-- 1. 開場主畫面 -->
        <div id="start-screen" class="modal">
            <h1>夜市吃貨小精靈</h1>
            <p>台味吊嘎小哥 vs 熱情夜市老伯！<br>吃各類「特色台灣湯品」觸發美食問答！</p>
            <input type="text" id="player-name-input" value="吃貨小精靈" placeholder="請輸入暱稱" maxlength="8">
            <div style="display: flex; flex-direction: column; width: 75%; max-width: 280px; gap: 8px;">
                <button class="btn btn-green" id="start-btn" type="button">開始營業 / 出發！</button>
                <button class="btn" id="btn-open-editor" type="button">⚙️ 難度與題庫管理</button>
            </div>
            <p style="font-size:clamp(12px, 1.9vmin, 15px); margin-top:12px; color:#aaaaaa;">(支援螢幕觸控滑動 / 鍵盤 WASD 方向鍵)</p>
        </div>

        <!-- 2. 遊戲設定與題庫編輯頁面 -->
        <div id="editor-screen" class="modal hidden">
            <div class="editor-header">
                <span style="font-size: 16px; font-weight: bold; color: var(--neon-yellow);">⚙️ 遊戲難度與題庫設定</span>
                <div>
                    <button class="btn btn-green" id="btn-save-quiz" type="button" style="padding: 6px 12px; font-size: 13px;">💾 儲存</button>
                    <button class="btn" id="btn-cancel-quiz" type="button" style="padding: 6px 12px; font-size: 13px;">✖ 關閉</button>
                </div>
            </div>

            <div class="settings-bar">
                <div class="setting-item">
                    <label for="select-map">🗺️ 迷宮難度：</label>
                    <select id="select-map" class="editor-select">
                        <option value="easy">🟢 綠島夜市 (簡單 12×12)</option>
                        <option value="normal">🟡 通化夜市 (普通 19×19)</option>
                        <option value="hard">🔴 九份老街 (困難 19×19)</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label for="select-ghosts">👴 老闆數量：</label>
                    <select id="select-ghosts" class="editor-select">
                        <option value="1">1 位 (悠閒)</option>
                        <option value="2">2 位 (標準)</option>
                        <option value="3">3 位 (熱鬧)</option>
                        <option value="4">4 位 (尖峰暴走!)</option>
                    </select>
                </div>
            </div>

            <div style="font-size: 13px; color: #bbbbbb; margin-bottom: 6px;">
                💡 <b>提示</b>：地圖上有 <span id="current-quiz-count" style="color:var(--neon-yellow); font-weight:bold;">4</span> 碗湯，分別對應下面 4 道題目！可點擊 <b>[📂 選圖]</b> 自由新增題目或選項照片。
            </div>

            <div class="editor-list" id="editor-list"></div>
            <div style="margin-top: 8px; display: flex; gap: 8px; width: 100%; justify-content: space-between;">
                <button class="btn" id="btn-add-quiz" type="button" style="font-size: 13px; flex: 1;">➕ 新增一道題目</button>
                <button class="btn btn-danger" id="btn-reset-default" type="button" style="font-size: 13px;">🔄 恢復指定 4 題</button>
            </div>
        </div>

        <!-- 3. 美食問答畫面 -->
        <div id="quiz-screen" class="modal hidden">
            <h2 id="quiz-title">品嚐【貢丸湯】能量大爆發！</h2>
            <p id="quiz-question">題目載入中...</p>
            <img id="quiz-q-img" class="hidden" alt="題目圖片" />
            
            <div class="quiz-options" id="quiz-options"></div>
            <div id="quiz-feedback" style="margin-top:10px; font-weight:bold; font-size:clamp(15px, 2.4vmin, 20px); line-height: 1.4; min-height: 34px;"></div>
            <button class="btn hidden" id="quiz-continue-btn" type="button">立即返回遊戲</button>
        </div>

        <!-- 4. 結束/通關畫面 -->
        <div id="game-over-screen" class="modal hidden">
            <h1 id="end-title">Game Over</h1>
            <p id="end-message">肚子撐破啦！被熱情老伯抓到了！</p>
            <p>最終得分: <span id="final-score" style="color:var(--neon-yellow); font-size:clamp(24px, 4.4vmin, 34px);">0</span></p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-green" id="restart-btn" type="button">重新挑戰</button>
                <button class="btn" id="menu-btn" type="button">🏠 返回主畫面</button>
            </div>
        </div>
    </div>

        function processImageFile(file, callback) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvasTmp = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const maxDim = 260;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }
                    canvasTmp.width = w;
                    canvasTmp.height = h;
                    const cTmp = canvasTmp.getContext('2d');
                    cTmp.drawImage(img, 0, 0, w, h);
                    callback(canvasTmp.toDataURL('image/jpeg', 0.88));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function buildDynamicMap() {

            canvas.height = ROWS * CELL_SIZE;

            const template = MAP_TEMPLATES[selectedMapType] || MAP_TEMPLATES.normal;
            let newMap = template.map(row => [...row]);
            soupQuestionMap = {};
            soupTypeMap = {};

            let validSpots = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (newMap[r][c] === 2) {
                        validSpots.push({ r, c });
                    }
                }
            }

            const preferredPoints = cfg.preferredPoints;
            let targetSoupCount = quizBank.length;
            let chosenSoupSpots = [];

            for (let pt of preferredPoints) {
                if (chosenSoupSpots.length >= targetSoupCount) break;
                if (newMap[pt.r] && newMap[pt.r][pt.c] === 2) {
                    chosenSoupSpots.push(pt);
                }
            }

            if (chosenSoupSpots.length < targetSoupCount) {
                let remainingSpots = validSpots.filter(v => !chosenSoupSpots.some(c => c.r === v.r && c.c === v.c));
                let needed = targetSoupCount - chosenSoupSpots.length;
                let step = Math.max(1, Math.floor(remainingSpots.length / needed));
                for (let i = 0; i < remainingSpots.length && chosenSoupSpots.length < targetSoupCount; i += step) {
                    chosenSoupSpots.push(remainingSpots[i]);
                }
            }

            chosenSoupSpots.forEach((pt, index) => {
                newMap[pt.r][pt.c] = 3;
                soupQuestionMap[`${pt.r},${pt.c}`] = index;
                soupTypeMap[`${pt.r},${pt.c}`] = index % SOUP_ROSTER.length;
            });

            return newMap;
        }

        // ================= 音效系統 =================
        let audioCtx = null;
        function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx && AudioContext) audioCtx = new AudioContext();
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {}
        }
        window.addEventListener('touchstart', initAudio, { once: true, passive: true });
        window.addEventListener('click', initAudio, { once: true, passive: true });

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                
                if (type === 'chomp') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'power') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'eatGhost') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(1000, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now); osc.stop(now + 0.4);
                }
            } catch (e) {}
        }

        function getTunnelRow() {
            const cfg = MAP_CONFIGS[selectedMapType] || MAP_CONFIGS.normal;
            return cfg.tunnelRow;
        }

        function canMove(gx, gy, direction) {
            let nx = gx;
            let ny = gy;
            if (direction === DIR.RIGHT) nx += 1;
            else if (direction === DIR.LEFT) nx -= 1;
            else if (direction === DIR.UP) ny -= 1;
            else if (direction === DIR.DOWN) ny += 1;

            if (ny === getTunnelRow() && (nx < 0 || nx >= COLS)) return true;
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;

            return map[ny][nx] !== 1;
        }

        function isOpposite(d1, d2) {
            return (d1 === DIR.LEFT && d2 === DIR.RIGHT) ||
                   (d1 === DIR.RIGHT && d2 === DIR.LEFT) ||
                   (d1 === DIR.UP && d2 === DIR.DOWN) ||
                   (d1 === DIR.DOWN && d2 === DIR.UP);
        }

        function drawMap() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const tile = map[r][c];
                    const x = c * CELL_SIZE;
                    const y = r * CELL_SIZE;

                    if (tile === 1) {
                        drawTentRoofWall(x, y);
                    } else if (tile === 2) {
                        // 繪製金色像素小腳印
                        drawFootprint(x, y);
                    } else if (tile === 3) {
                        const soupType = soupTypeMap[`${r},${c}`] !== undefined ? soupTypeMap[`${r},${c}`] : 0;
                        drawDiverseSoup(x + CELL_SIZE/2, y + CELL_SIZE/2, soupType);
                    }
                }
            }
        }

        // ================= 玩家角色類別（無敵星星黃光特效＋快結束閃爍） =================
        class Player {
            constructor(gx, gy) {
                this.startX = gx;
                this.startY = gy;
                this.facingLeft = false;
                this.reset();
            }
            reset() {
                this.x = this.startX * CELL_SIZE + CELL_SIZE / 2;
                this.y = this.startY * CELL_SIZE + CELL_SIZE / 2;
                this.dir = DIR.STOP;
                this.nextDir = DIR.STOP;
                this.speed = 2; 
            }
            get gridX() { return Math.floor(this.x / CELL_SIZE); }
            get gridY() { return Math.floor(this.y / CELL_SIZE); }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 無敵星星黃光特效處理 (快結束時閃爍)
                if (powerModeTime > 0) {
                    const isBlinking = powerModeTime <= 150; // 最後約 2.5 秒開始閃爍提示
                    const showGlow = !isBlinking || (Math.floor(frameCount / 6) % 2 === 0);

                    if (showGlow) {
                        ctx.save();
                        // 擴散放射狀黃金光暈 (Aura)
                        const glowRadius = 13 + Math.sin(frameCount * 0.35) * 3;
                        const grad = ctx.createRadialGradient(0, 0, 3, 0, 0, glowRadius);
                        grad.addColorStop(0, 'rgba(255, 234, 0, 0.85)');
                        grad.addColorStop(0.5, 'rgba(255, 215, 0, 0.45)');
                        grad.addColorStop(1, 'rgba(255, 234, 0, 0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
                        ctx.fill();

                        // 金光微粒閃耀效果
                        ctx.strokeStyle = '#fff59d';
                        ctx.lineWidth = 1.2;
                        const sparkDist = glowRadius * 0.9;
                        const angleOff = frameCount * 0.1;
                        for (let a = 0; a < 4; a++) {
                            const ang = angleOff + (a * Math.PI / 2);
                            const sx = Math.cos(ang) * sparkDist;
                            const sy = Math.sin(ang) * sparkDist;
                            ctx.strokeRect(sx - 1, sy - 1, 2, 2);
                        }
                        ctx.restore();

                        // 為角色本體加上金色陰影
                        ctx.shadowColor = '#ffea00';
                        ctx.shadowBlur = 10;
                    }
                }

                if (this.dir === DIR.LEFT) this.facingLeft = true;
                if (this.dir === DIR.RIGHT) this.facingLeft = false;
                if (this.facingLeft) ctx.scale(-1, 1);

                const isEatingOpen = (Math.floor(frameCount / 6) % 2 === 0) && (this.dir !== DIR.STOP);
                const mouthLine = isEatingOpen ? '.S.MM..S....' : '..SMMSS.....'; 

                const sprite = [
                    '..HHHHH.....',  
                    '.HHHHHHH....',  
                    '.HHSSSSH....',  
                    '..SE.SS.....',  
                    '..SSSSSS....',  
                    mouthLine,       
                    '.SWWWWS.....',  
                    '.SWWWWS.....',  
                    '..BBBB......',  
                    '..SS.SS.....',  
                    '..BW.BW.....',  
                    '............'
                ];

                const palette = {
                    'H': '#1c1c1c', 'S': '#ffcd94', 'E': '#000000',
                    'M': '#d32f2f', 'W': '#ffffff', 'B': '#1565c0'
                };

                const scale = 1.35;
                const ox = - (12 * scale) / 2;
                const oy = - (12 * scale) / 2;

                drawPixelSprite(ctx, sprite, palette, scale, ox, oy);
                ctx.restore();
            }

            update() {
                for (let s = 0; s < this.speed; s++) {
                    this.step();
                    if (gameState !== 'PLAY') return;
                }
            }

            step() {
                if (isOpposite(this.dir, this.nextDir)) {
                    this.dir = this.nextDir;
                }

                const atCenterX = (this.x - CELL_SIZE / 2) % CELL_SIZE === 0;
                const atCenterY = (this.y - CELL_SIZE / 2) % CELL_SIZE === 0;

                if (atCenterX && atCenterY) {
                    const gx = Math.round((this.x - CELL_SIZE / 2) / CELL_SIZE);
                    const gy = Math.round((this.y - CELL_SIZE / 2) / CELL_SIZE);

                    if (map[gy] && map[gy][gx] === 2) {
                        map[gy][gx] = 0;
                        score += 10;
                        updateHUD();
                        playSound('chomp');
                        checkWin();
                    } else if (map[gy] && map[gy][gx] === 3) {
                        map[gy][gx] = 0;
                        const key = `${gy},${gx}`;
                        const qIdx = soupQuestionMap[key] !== undefined ? soupQuestionMap[key] : 0;
                        const soupType = soupTypeMap[key] !== undefined ? soupTypeMap[key] : 0;
                        delete soupQuestionMap[key];
                        delete soupTypeMap[key];
                        triggerQuiz(qIdx, soupType);
                        return; 
                    }

                    if (this.nextDir !== DIR.STOP && canMove(gx, gy, this.nextDir)) {
                        this.dir = this.nextDir;
                    }

                    if (!canMove(gx, gy, this.dir)) {
                        this.dir = DIR.STOP;
                        return;
                    }
                }

                if (this.dir === DIR.RIGHT) this.x += 1;
                else if (this.dir === DIR.LEFT) this.x -= 1;
                else if (this.dir === DIR.UP) this.y -= 1;
                else if (this.dir === DIR.DOWN) this.y += 1;

                if (this.x < -CELL_SIZE / 2) this.x = COLS * CELL_SIZE + CELL_SIZE / 2;
                else if (this.x > COLS * CELL_SIZE + CELL_SIZE / 2) this.x = -CELL_SIZE / 2;
            }
        }

        // ================= 老闆角色類別（維持原樣不變色，僅受驚嚇時帶小汗珠） =================
        class Ghost {
            constructor(gx, gy, towelColor, propType) {
                this.startX = gx;
                this.startY = gy;
                this.towelColor = towelColor;
                this.propType = propType;
                this.reset();
            }
            reset() {
                this.x = this.startX * CELL_SIZE + CELL_SIZE / 2;
                this.y = this.startY * CELL_SIZE + CELL_SIZE / 2;
                this.dir = DIR.UP;
                this.state = 'NORMAL'; 
            }
            get gridX() { return Math.floor(this.x / CELL_SIZE); }
            get gridY() { return Math.floor(this.y / CELL_SIZE); }

            draw() {
                ctx.save();
                const wobble = (this.dir !== DIR.STOP) ? Math.sin(frameCount * 0.25 + this.propType) * 1.5 : 0;
                ctx.translate(this.x, this.y + wobble);

                if (this.dir === DIR.LEFT) ctx.scale(-1, 1);

                const isScared = this.state === 'SCARED';

                // 老闆始終維持經典原版配色（不變色）
                const sprite = [
                    '...SSS......',
                    '.GGSSSSGG...',
                    'G..E..E.G...',
                    '...SSSS.....',
                    '..SBBBB.....',
                    '.T.VVVV.T...',
                    '.T.VVVV.T...',
                    '..KKKK......',
                    '..SS.SS.....',
                    '..BW.BW.....',
                    '............',
                    '............'
                ];
                const palette = {
                    'S': '#f5cba7', // 親切健康膚色
                    'G': '#cfd8dc', // 灰白鬢髮
                    'E': '#000000', // 眼睛
                    'B': '#eceff1', // 白鬍子
                    'T': this.towelColor, // 專屬汗毛巾色
                    'V': '#ffffff', // 白汗衫
                    'K': '#8d6e63', // 咖啡短褲
                    'B': '#1565c0', 'W': '#ffffff'
                };

                const scale = 1.35;
                const ox = - (12 * scale) / 2;
                const oy = - (12 * scale) / 2;

                drawPixelSprite(ctx, sprite, palette, scale, ox, oy);

                // 當受驚嚇時，頭上冒出一滴緊張小冷汗珠 (💦)，外觀與衣服不變色！
                if (isScared) {
                    ctx.fillStyle = '#40c4ff';
                    ctx.fillRect(6, -8, 2, 3);
                    ctx.fillRect(7, -7, 2, 2);
                }

                ctx.restore();
            }

            update() {
                let steps = (this.state === 'SCARED') ? ((frameCount % 2 === 0) ? 1 : 0) : ((frameCount % 4 === 0) ? 1 : 2);
                for (let s = 0; s < steps; s++) {
                    this.step();
                }
            }

            step() {
                const atCenterX = (this.x - CELL_SIZE / 2) % CELL_SIZE === 0;
                const atCenterY = (this.y - CELL_SIZE / 2) % CELL_SIZE === 0;

                if (atCenterX && atCenterY) {
                    const gx = Math.round((this.x - CELL_SIZE / 2) / CELL_SIZE);
                    const gy = Math.round((this.y - CELL_SIZE / 2) / CELL_SIZE);

                    this.chooseDirection(gx, gy);

                    if (!canMove(gx, gy, this.dir)) {
                        this.dir = DIR.STOP;
                        return;
                    }
                }

                if (this.dir === DIR.RIGHT) this.x += 1;
                else if (this.dir === DIR.LEFT) this.x -= 1;
                else if (this.dir === DIR.UP) this.y -= 1;
                else if (this.dir === DIR.DOWN) this.y += 1;

                if (this.x < -CELL_SIZE / 2) this.x = COLS * CELL_SIZE + CELL_SIZE / 2;
                else if (this.x > COLS * CELL_SIZE + CELL_SIZE / 2) this.x = -CELL_SIZE / 2;
            }

            chooseDirection(gx, gy) {
                const allDirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
                let validDirs = [];

                for (let d of allDirs) {
                    if (isOpposite(d, this.dir)) continue;
                    if (canMove(gx, gy, d)) validDirs.push(d);
                }

                if (validDirs.length === 0) {
                    for (let d of allDirs) {
                        if (canMove(gx, gy, d)) validDirs.push(d);
                    }
                }

                if (validDirs.length > 0) {
                    if (this.state === 'SCARED' || Math.random() < 0.45) {
                        this.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
                    } else {
                        let bestDir = validDirs[0];
                        let minDist = Infinity;
                        for (let d of validDirs) {
                            let tx = gx + (d === DIR.RIGHT ? 1 : d === DIR.LEFT ? -1 : 0);
                            let ty = gy + (d === DIR.DOWN ? 1 : d === DIR.UP ? -1 : 0);
                            let dist = Math.hypot(tx - player.gridX, ty - player.gridY);
                            if (dist < minDist) {
                                minDist = dist;
                                bestDir = d;
                            }
                        }
                        this.dir = bestDir;
                    }
                }
            }
        }

                touchStartX = e.changedTouches[0].clientX;
                touchStartY = e.changedTouches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (gameState !== 'PLAY' || !e.changedTouches || e.changedTouches.length === 0) return;
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20) player.nextDir = DIR.RIGHT;
                else if (dx < -20) player.nextDir = DIR.LEFT;
            } else { 
                if (dy > 20) player.nextDir = DIR.DOWN;
                else if (dy < -20) player.nextDir = DIR.UP;
            }
        }, { passive: true });

        // 問答視窗控制
        function triggerQuiz(quizIndex = 0, soupTypeIndex = 0) {
            if (gameState === 'QUIZ') return;
            gameState = 'QUIZ';
            playSound('power');
            
            if (quizTimer) clearTimeout(quizTimer);

            currentQuiz = quizBank[quizIndex] || quizBank[0];
            
            const soupName = SOUP_ROSTER[soupTypeIndex % SOUP_ROSTER.length];
            document.getElementById('quiz-title').innerText = `品嚐【${soupName}】能量大爆發！`;
            
            document.getElementById('quiz-question').innerText = currentQuiz.q;

            const qImgElement = document.getElementById('quiz-q-img');
            if (currentQuiz.qImg && currentQuiz.qImg.trim() !== '') {

                qImgElement.classList.remove('hidden');
            } else {
                qImgElement.classList.add('hidden');
            }
            
            const optionsDiv = document.getElementById('quiz-options');
            optionsDiv.innerHTML = '';
            document.getElementById('quiz-feedback').innerHTML = '';
            
            const continueBtn = document.getElementById('quiz-continue-btn');
            continueBtn.classList.add('hidden');

            currentQuiz.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn quiz-btn';
                btn.type = 'button';

                const optText = typeof opt === 'string' ? opt : opt.text;
                const optImg = (typeof opt === 'object' && opt.img) ? opt.img : null;

                const span = document.createElement('span');
                span.className = 'quiz-opt-text';
                span.innerText = optText;
                btn.appendChild(span);

                if (optImg && optImg.trim() !== '') {
                    const img = document.createElement('img');
                    img.className = 'quiz-opt-img';
                    img.src = optImg;

                btn.addEventListener('click', () => {

                    handleQuizAnswer(idx, btn);

        function handleQuizAnswer(selectedIndex, btnElement) {
            const btns = document.querySelectorAll('.quiz-btn');
            btns.forEach(b => b.disabled = true);

            const feedback = document.getElementById('quiz-feedback');
            const title = document.getElementById('quiz-title');
            const continueBtn = document.getElementById('quiz-continue-btn');

            continueBtn.classList.remove('hidden');

            const correctOpt = currentQuiz.options[currentQuiz.ans];
            const correctText = typeof correctOpt === 'string' ? correctOpt : correctOpt.text;

            if (selectedIndex === currentQuiz.ans) {
                title.innerText = "回答正確！能量爆發！";
                title.style.color = "var(--neon-blue)";
                feedback.innerHTML = "<span style='color:var(--neon-blue)'>答對了！身上散發無敵金光，快反擊！</span><br><span style='color:#aaaaaa'>(2 秒後自動返回...)</span>";
                btnElement.style.background = "var(--neon-blue)";
                btnElement.style.color = "#000000";

                powerModeTime = 450; 
                ghosts.forEach(g => g.state = 'SCARED');
                playSound('power');

                quizTimer = setTimeout(() => resumeGame(), 2000);
            } else {
                title.innerText = "答錯囉！";
                title.style.color = "var(--neon-pink)";
                feedback.innerHTML = `<span style='color:var(--neon-pink)'>正確答案是：【${correctText}】</span><br><span style='color:#aaaaaa'>能量被沒收了...(2.5 秒後自動返回...)</span>`;
                btnElement.style.background = "var(--neon-pink)";
                btnElement.style.color = "#ffffff";

                btns[currentQuiz.ans].style.borderColor = "var(--neon-blue)";
                btns[currentQuiz.ans].style.boxShadow = "0 0 10px var(--neon-blue) inset";
                playSound('die');

                quizTimer = setTimeout(() => resumeGame(), 2500);
            }
        }

        // 關鍵修復：返回遊戲時立即檢查是否已經吃光所有湯品與腳印
        function resumeGame() {
            if (quizTimer) {
                clearTimeout(quizTimer);
                quizTimer = null;
            }
            document.getElementById('quiz-screen').classList.add('hidden');
            gameState = 'PLAY';
            cancelAnimationFrame(animationId);
            
            // 檢查是否已通關
            checkWin();

            if (gameState === 'PLAY') {
                gameLoop();
            }
        }

        bindClick('quiz-continue-btn', () => {

        });

        // 核心迴圈
        function gameLoop() {
            if (gameState !== 'PLAY') return;
            frameCount++;

            player.update();
            if (gameState !== 'PLAY') return;

            ghosts.forEach(g => g.update());

            if (powerModeTime > 0) {
                powerModeTime--;
                if (powerModeTime === 0) ghosts.forEach(g => g.state = 'NORMAL');
            }

            const hitDistance = CELL_SIZE * 0.75;
            for (let g of ghosts) {
                let dist = Math.hypot(player.x - g.x, player.y - g.y);
                if (dist < hitDistance) {
                    if (g.state === 'SCARED') {
                        score += 50;
                        updateHUD();
                        playSound('eatGhost');
                        g.reset(); 
                    } else {
                        handleDeath();
                        return;
                    }
                }
            }

            drawMap();
            player.draw();
            ghosts.forEach(g => g.draw());

            animationId = requestAnimationFrame(gameLoop);
        }

        function handleDeath() {
            gameState = 'PAUSE';
            playSound('die');
            lives--;
            updateHUD();
            
            if (lives > 0) {
                setTimeout(() => {
                    resetAllPositions();
                    gameState = 'PLAY';
                    gameLoop();
                }, 1200);
            } else {
                gameState = 'GAMEOVER';
                setTimeout(() => {
                    document.getElementById('end-title').innerText = "Game Over";
                    document.getElementById('end-message').innerText = "肚子撐破啦！被熱情老伯抓到了！";
                    document.getElementById('final-score').innerText = score;
                    document.getElementById('game-over-screen').classList.remove('hidden');
                }, 800);
            }
        }

        // 通關檢查
        function checkWin() {
            let hasFood = false;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (map[r][c] === 2 || map[r][c] === 3) hasFood = true;
                }
            }
            if (!hasFood) {
                gameState = 'VICTORY';
                document.getElementById('end-title').innerText = "通關大吉！";
                document.getElementById('end-title').style.color = "var(--neon-blue)";
                document.getElementById('end-message').innerText = "太厲害了！你吃光了整座夜市的美食！";
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
        }

        // 初始化
        map = buildDynamicMap();
        initGhostTeam();
        resetAllPositions();
        drawMap();
    </script>
</body>
</html>
