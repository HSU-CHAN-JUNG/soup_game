<!DOCTYPE html>
<html lang="zh-TW">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
 <title>夜市吃貨小精靈 - 台灣美食探險</title>
 <style>
 :root {
 --neon-pink: #ff2a6d;
 --neon-blue: #05d9e8;
 --neon-yellow: #ffc400;
 --neon-green: #00ff66;
 --bg-color: #111111;
 --text-color: #ffffff;
 }
 
 * { 
 box-sizing: border-box; 
 margin: 0; 
 padding: 0; 
 -webkit-tap-highlight-color: transparent;
 }
 
 html, body {
 background-color: #111111 !important;
 color: #ffffff !important;
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "PingFang TC", sans-serif;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 min-height: 100vh;
 min-height: -webkit-fill-available;
 overflow: hidden;
 touch-action: manipulation;
 }

 button, input, select {
 touch-action: manipulation !important;
 cursor: pointer;
 font-family: inherit;
 pointer-events: auto !important;
 user-select: auto !important;
 -webkit-user-select: auto !important;
 }

 /* HUD 狀態列 */
 #hud {
 width: min(95vw, calc((100vh - 100px) * (19 / 12)));
 max-width: 95vw;
 display: flex;
 justify-content: space-between;
 align-items: center;
 padding: clamp(6px, 1.2vh, 12px) clamp(14px, 2vw, 24px);
 background: rgba(0,0,0,0.9) !important;
 border: 2px solid var(--neon-blue);
 border-radius: 10px;
 margin-bottom: 8px;
 box-shadow: 0 0 10px var(--neon-blue);
 font-weight: bold;
 font-size: clamp(14px, 2.1vmin, 20px);
 }
 
 .hud-item { display: flex; align-items: center; }
 #lives { color: var(--neon-pink); letter-spacing: 2px; }

 /* 遊戲畫布容器 */
 #game-container {
 position: relative;
 box-shadow: 0 0 25px var(--neon-pink);
 border-radius: 10px;
 overflow: hidden;
 background-color: #050505 !important;
 width: min(95vw, calc((100vh - 100px) * (19 / 12)));
 height: calc(min(95vw, calc((100vh - 100px) * (19 / 12))) * (12 / 19));
 aspect-ratio: 19 / 12;
 max-width: 96vw;
 max-height: calc(100vh - 90px);
 }
 
 canvas {
 display: block;
 width: 100%;
 height: 100%;
 image-rendering: pixelated;
 touch-action: none;
 background-color: #050505;
 }

 .hidden { 
 display: none !important; 
 pointer-events: none !important;
 }

 /* 倒數計時遮罩 */
 #countdown-overlay {
 position: absolute;
 top: 0; left: 0; width: 100%; height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: rgba(0, 0, 0, 0.35) !important;
 z-index: 25;
 pointer-events: none;
 backdrop-filter: blur(1.5px);
 }

 #countdown-text {
 font-size: clamp(54px, 16vmin, 108px);
 font-weight: 900;
 color: var(--neon-yellow);
 text-shadow: 0 0 18px currentColor, 0 0 35px currentColor;
 letter-spacing: 3px;
 user-select: none;
 -webkit-user-select: none;
 }

 @keyframes countZoom {
 0% { transform: scale(1.6); opacity: 0; }
 25% { transform: scale(1.0); opacity: 1; }
 80% { transform: scale(0.96); opacity: 1; }
 100% { transform: scale(0.85); opacity: 0; }
 }

 /* 介面彈窗遮罩 */
 .modal {
 position: absolute;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(17, 17, 17, 0.96) !important;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: clamp(12px, 2.8vmin, 24px);
 text-align: center;
 z-index: 30;
 overflow-y: auto;
 -webkit-overflow-scrolling: touch;
 pointer-events: auto;
 }

 .modal h1 {
 color: var(--neon-yellow) !important;
 text-shadow: 0 0 14px var(--neon-yellow);
 margin-bottom: clamp(10px, 2vmin, 18px);
 font-size: clamp(24px, 4.6vmin, 36px);
 }

 .modal h2#quiz-title {
 color: var(--neon-yellow) !important;
 font-size: clamp(14px, 2.2vmin, 17px) !important;
 font-weight: 600;
 margin-bottom: 4px;
 opacity: 0.9;
 letter-spacing: 1px;
 }

 .modal p { 
 color: #ffffff !important;
 margin-bottom: 10px; 
 line-height: 1.45; 
 font-size: clamp(16px, 2.5vmin, 21px);
 }

 #quiz-question {
 font-size: clamp(40px, 3.4vmin, 36px) !important;
 font-weight: bold !important;
 color: var(--neon-blue) !important;
 margin: 8px 0 12px !important;
 line-height: 1.35 !important;
 text-shadow: 0 0 10px rgba(5, 217, 232, 0.4);
 }

 /* 霓虹按鈕 */
 .btn {
 background: #111111;
 color: var(--neon-blue);
 border: 2px solid var(--neon-blue);
 padding: clamp(8px, 1.5vmin, 13px) clamp(16px, 2.8vmin, 28px);
 font-size: clamp(26px, 2.2vmin, 19px);
 border-radius: 24px;
 font-weight: bold;
 margin: 4px;
 box-shadow: 0 0 5px var(--neon-blue) inset, 0 0 5px var(--neon-blue);
 display: inline-flex;
 align-items: center;
 justify-content: center;
 }
 .btn:active {
 background: var(--neon-blue) !important;
 color: #000000 !important;
 }
 .btn-green {
 color: var(--neon-green) !important;
 border-color: var(--neon-green) !important;
 box-shadow: 0 0 5px var(--neon-green) inset, 0 0 5px var(--neon-green);
 }
 .btn-green:active {
 background: var(--neon-green) !important;
 color: #000000 !important;
 }
 .btn-danger {
 color: var(--neon-pink) !important;
 border-color: var(--neon-pink) !important;
 box-shadow: 0 0 5px var(--neon-pink) inset, 0 0 5px var(--neon-pink);
 }
 .btn-danger:active {
 background: var(--neon-pink) !important;
 color: #ffffff !important;
 }

 #player-name-input {
 padding: clamp(8px, 1.6vmin, 14px);
 font-size: clamp(16px, 2.6vmin, 20px);
 border-radius: 8px;
 border: 2px solid var(--neon-pink);
 background: #222222;
 color: #ffffff;
 text-align: center;
 margin-bottom: clamp(10px, 2vmin, 16px);
 width: 80%;
 max-width: 300px;
 }

 /* 選項按鈕區 */
 .quiz-options {
 display: grid;
 grid-template-columns: 1fr 1fr;
 width: 95%;
 max-width: 460px;
 gap: clamp(8px, 1.5vmin, 12px);
 }
 @media (max-width: 380px) {
 .quiz-options { grid-template-columns: 1fr; }
 }
 .quiz-btn {
 border-color: var(--neon-pink);
 color: #ffffff;
 box-shadow: 0 0 5px var(--neon-pink) inset;
 padding: clamp(10px, 1.6vmin, 14px) clamp(8px, 1.2vmin, 12px);
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 gap: 6px;
 text-align: center;
 min-height: 56px;
 }
 .quiz-btn:active {
 background: rgba(255, 42, 109, 0.4) !important;
 border-color: var(--neon-yellow) !important;
 }

 .quiz-opt-text {
 width: 100%;
 white-space: normal;
 word-break: break-word;
 line-height: 1.35;
 font-weight: bold;
 font-size: clamp(32px, 2.7vmin, 21px) !important;
 }

 /* 題庫編輯器樣式 */
 #editor-screen, #leaderboard-screen {
 justify-content: flex-start;
 text-align: left;
 padding: 12px;
 }
 .editor-header {
 width: 100%;
 display: flex;
 justify-content: space-between;
 align-items: center;
 border-bottom: 2px solid var(--neon-blue);
 padding-bottom: 8px;
 margin-bottom: 10px;
 }
 .settings-bar {
 width: 100%;
 background: rgba(0, 240, 255, 0.08);
 border: 1px solid var(--neon-blue);
 border-radius: 8px;
 padding: 8px 10px;
 margin-bottom: 10px;
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 font-size: 14px;
 }
 .setting-item {
 display: flex;
 flex-direction: column;
 gap: 4px;
 }
 .setting-item label {
 color: var(--neon-yellow);
 font-weight: bold;
 }
 .editor-select {
 background: #222222;
 color: #ffffff;
 border: 1px solid #666666;
 padding: 6px;
 border-radius: 4px;
 font-size: 13px;
 outline: none;
 }

 .editor-list {
 width: 100%;
 display: flex;
 flex-direction: column;
 gap: 10px;
 overflow-y: auto;
 max-height: calc(100% - 130px);
 padding-right: 4px;
 }
 .quiz-card {
 background: rgba(255, 255, 255, 0.05);
 border: 1px solid rgba(255, 255, 255, 0.2);
 border-radius: 8px;
 padding: 10px;
 display: flex;
 flex-direction: column;
 gap: 6px;
 }
 .quiz-card-head {
 display: flex;
 justify-content: space-between;
 align-items: center;
 font-size: 14px;
 color: var(--neon-yellow);
 font-weight: bold;
 }
 .editor-input {
 width: 100%;
 background: #222222;
 border: 1px solid #555555;
 color: #ffffff;
 padding: 6px 8px;
 font-size: 14px;
 border-radius: 4px;
 outline: none;
 }
 .opt-row {
 display: flex;
 align-items: center;
 gap: 6px;
 font-size: 13px;
 }

 /* 排行榜專用表格樣式 */
 .leaderboard-table-wrap {
 width: 100%;
 overflow-y: auto;
 max-height: calc(100% - 120px);
 margin-top: 6px;
 border: 1px solid rgba(5, 217, 232, 0.3);
 border-radius: 8px;
 background: rgba(0, 0, 0, 0.4);
 }
 .leaderboard-table {
 width: 100%;
 border-collapse: collapse;
 text-align: center;
 font-size: clamp(12px, 1.9vmin, 15px);
 }
 .leaderboard-table th {
 background: rgba(5, 217, 232, 0.15);
 color: var(--neon-yellow);
 padding: 8px 6px;
 border-bottom: 1px solid var(--neon-blue);
 position: sticky;
 top: 0;
 }
 .leaderboard-table td {
 padding: 8px 6px;
 border-bottom: 1px solid rgba(255, 255, 255, 0.08);
 color: #ffffff;
 }
 .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
 .leaderboard-table tr:nth-child(2) td { color: #e0e0e0; font-weight: bold; }
 .leaderboard-table tr:nth-child(3) td { color: #cd7f32; font-weight: bold; }
 </style>
</head>
<body>

 <div id="hud">
 <div class="hud-item">👤 <span id="display-name">玩家</span></div>
 <div class="hud-item">🏆 分數: <span id="score">0</span></div>
 <div class="hud-item" id="lives">❤️❤️❤️</div>

   <button id="music-toggle-btn" class="btn" type="button" style="padding: 3px 8px; font-size: 13px; margin: 0; border-radius: 10px;">🎵 音樂: 開</button>

 <!-- 1. 開場主畫面 -->
 <div id="start-screen" class="modal">
 <h1>夜市吃貨小精靈</h1>
 <p>台味吊嘎小哥 vs 熱情夜市老伯！<br>搜集滿街「香噴噴烤肉串燒」與「隨機驚喜茄芷袋」！</p>

 <option value="easy">🟢 綠島夜市 (簡單 12×12)</option>

 <script>
 const BGM_URL = "music/emmraan-funny-punk-rock-203366.mp3"; 

 let bgm = null;
 try {
   bgm = new Audio(BGM_URL);
   bgm.loop = true;
   bgm.volume = 0.35;
 } catch(e) {}

 let isMusicMuted = false;

 function playBGM() {
   if (isMusicMuted || !bgm) return;
   bgm.play().catch(() => {});
 }
 function pauseBGM() {
   if (bgm) bgm.pause();
 }
 function lowerBGM() {
   if (bgm && !isMusicMuted) bgm.volume = 0.15;
 }
 function restoreBGM() {
   if (bgm && !isMusicMuted) bgm.volume = 0.35;
 }

 const canvas = document.getElementById('gameCanvas');
 const ctx = canvas.getContext('2d');
 const CELL_SIZE = 20;
 
 let ROWS = 12;
 let COLS = 19;
 
 const DIR = { STOP: 0, RIGHT: 1, LEFT: 2, UP: 3, DOWN: 4 };

 let gameState = 'START'; 
 let score = 0;
 let lives = 3;
 let playerName = "";
 let animationId = null;
 let quizTimer = null;
 let countdownTimer = null;
 let frameCount = 0;
 let powerModeTime = 0;

 function shuffleArray(arr) {
   const copy = [...arr];
   for (let i = copy.length - 1; i > 0; i--) {
     const j = Math.floor(Math.random() * (i + 1));
     [copy[i], copy[j]] = [copy[j], copy[i]];
   }
   return copy;
 }

 function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, fillColor, strokeColor) {
   let rot = Math.PI / 2 * 3;
   let x = cx;
   let y = cy;
   let step = Math.PI / spikes;

   ctx.save();
   ctx.beginPath();
   ctx.moveTo(cx, cy - outerRadius);
   for (let i = 0; i < spikes; i++) {
     x = cx + Math.cos(rot) * outerRadius;
     y = cy + Math.sin(rot) * outerRadius;
     ctx.lineTo(x, y);
     rot += step;
     x = cx + Math.cos(rot) * innerRadius;
     y = cy + Math.sin(rot) * innerRadius;
     ctx.lineTo(x, y);
     rot += step;
   }
   ctx.lineTo(cx, cy - outerRadius);
   ctx.closePath();
   ctx.fillStyle = fillColor;
   ctx.fill();
   if (strokeColor) {
     ctx.strokeStyle = strokeColor;
     ctx.lineWidth = 1;
     ctx.stroke();
   }
   ctx.restore();
 }

 function drawSkewer(ctx, cx, cy) {
   ctx.save();
   ctx.translate(cx, cy);
   ctx.rotate(0.35);

   const sprite = [
     '....S....', 
     '...MMM...', 
     '..MMRMM..', 
     '...MMM...',
     '....S....', 
     '...YYY...', 
     '..YYYYY..',
     '...YYY...',
     '....S....', 
     '...GGG...', 
     '..GWGGG..', 
     '...GGG...',
     '....S....', 
     '....S....'
   ];

   const palette = {
     'S': '#d7a15c', 
     'M': '#c62828', 
     'R': '#ef5350', 
     'Y': '#ffb300', 
     'G': '#2e7d32', 
     'W': '#fffde7'  
   };

   const scale = 1.0;
   const ox = - (9 * scale) / 2;
   const oy = - (14 * scale) / 2;

   drawPixelSprite(ctx, sprite, palette, scale, ox, oy);
   ctx.restore();
 }

 function drawKachiBag(cx, cy) {
   const timeOffset = Math.sin(Date.now() / 150) * 1.8;
   const drawY = cy + timeOffset - 1;

   ctx.save();
   ctx.translate(cx, drawY);

   const sprite = [
     '..H......H..',
     '..H......H..',
     '.KKKKKKKKKK.',
     'BBWBBWBBWBBB',
     'BBBBWBBBWBBB',
     'RRWSSRWSSRWW',
     'RRRRSRRRSRRR',
     'GGWGGWGGWGGG',
     'GGGGWGGGWGGG',
     '.GGGGGGGGGG.',
     '..KKKKKKKK..'
   ];

   const palette = {
     'H': '#151515', 
     'K': '#212121', 
     'B': '#0088dd', 
     'R': '#e53935', 
     'G': '#43a047', 
     'W': '#ffffff', 
     'S': '#ffcdd2'  
   };

   const scale = 1.35;
   const ox = - (12 * scale) / 2;
   const oy = - (11 * scale) / 2;

   drawPixelSprite(ctx, sprite, palette, scale, ox, oy);
   ctx.restore();
 }

     }
   } catch (e) {}

 }

 function safeSetStorage(key, val) {

       window.localStorage.setItem(key, val);
     }
   } catch (e) {}
 }

 function updateContainerLayout() {
   const container = document.getElementById('game-container');
   const hud = document.getElementById('hud');
   if (!container || !hud) return;

   const maxW = Math.floor(window.innerWidth * 0.95);
   const maxH = Math.floor(window.innerHeight - 85);

   const mapAspect = (COLS * CELL_SIZE) / (ROWS * CELL_SIZE);
   
   let w = maxW;
   let h = w / mapAspect;

   if (h > maxH) {
     h = maxH;
     w = h * mapAspect;
   }

   const finalW = Math.max(280, Math.floor(w));
   const finalH = Math.max(180, Math.floor(h));

   container.style.width = `${finalW}px`;
   container.style.height = `${finalH}px`;
   hud.style.width = `${finalW}px`;
 }

 // 🌟 隨機生成地圖位置與隨機分配題目
 function buildDynamicMap() {
   const cfg = MAP_CONFIGS[selectedMapType] || MAP_CONFIGS.hard;
   ROWS = cfg.rows;
   COLS = cfg.cols;
   canvas.width = COLS * CELL_SIZE;
   canvas.height = ROWS * CELL_SIZE;

   updateContainerLayout();

   const template = MAP_TEMPLATES[selectedMapType] || MAP_TEMPLATES.hard;
   let newMap = template.map(row => [...row]);
   soupQuestionMap = {};

   let validSpots = [];
   for (let r = 0; r < ROWS; r++) {
     for (let c = 0; c < COLS; c++) {
       if (newMap[r][c] === 2) validSpots.push({ r, c });
     }
   }

   // 1. 隨機打亂候選點（位置不再固定）
   const shuffledPreferred = shuffleArray(cfg.preferredPoints);
   const shuffledValid = shuffleArray(validSpots);

   let targetSoupCount = Math.min(quizBank.length, 8);
   let chosenSoupSpots = [];

   for (let pt of shuffledPreferred) {
     if (chosenSoupSpots.length >= targetSoupCount) break;
     if (newMap[pt.r] && newMap[pt.r][pt.c] === 2 && !chosenSoupSpots.some(c => c.r === pt.r && c.c === pt.c)) {
       chosenSoupSpots.push(pt);
     }
   }

   if (chosenSoupSpots.length < targetSoupCount) {
     for (let pt of shuffledValid) {
       if (chosenSoupSpots.length >= targetSoupCount) break;
       if (!chosenSoupSpots.some(c => c.r === pt.r && c.c === pt.c)) {
         chosenSoupSpots.push(pt);
       }
     }
   }

   // 2. 隨機打散題目索引（吃到哪個袋子跳出哪一題完全不固定）
   const questionIndices = Array.from({ length: quizBank.length }, (_, i) => i);
   const shuffledQuestions = shuffleArray(questionIndices);

   chosenSoupSpots.forEach((pt, index) => {
     newMap[pt.r][pt.c] = 3;
     soupQuestionMap[`${pt.r},${pt.c}`] = shuffledQuestions[index % shuffledQuestions.length];
   });

   return newMap;
 }

 let audioCtx = null;
 function initAudio() {
   try {
     const AudioContext = window.AudioContext || window.webkitAudioContext;
     if (!audioCtx && AudioContext) audioCtx = new AudioContext();
     if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
   } catch (e) {}
 }
 window.addEventListener('touchstart', initAudio, { once: true, passive: true });
 window.addEventListener('click', initAudio, { once: true, passive: true });

 function playSound(type) {
   if (!audioCtx) return;
   try {
     const osc = audioCtx.createOscillator();
     const gain = audioCtx.createGain();
     osc.connect(gain);
     gain.connect(audioCtx.destination);
     const now = audioCtx.currentTime;
     
     if (type === 'chomp') {
       osc.type = 'sine';
       osc.frequency.setValueAtTime(450, now);
       osc.frequency.exponentialRampToValueAtTime(650, now + 0.08);
       gain.gain.setValueAtTime(0.08, now);
       gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
       osc.start(now); osc.stop(now + 0.08);
     } else if (type === 'beep') {
       osc.type = 'sine';
       osc.frequency.setValueAtTime(587.33, now);
       gain.gain.setValueAtTime(0.12, now);
       gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
       osc.start(now); osc.stop(now + 0.18);
     } else if (type === 'start') {
       osc.type = 'triangle';
       osc.frequency.setValueAtTime(587.33, now);
       osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.25);
       gain.gain.setValueAtTime(0.18, now);
       gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
       osc.start(now); osc.stop(now + 0.3);
     } else if (type === 'power') {
       osc.type = 'triangle';
       osc.frequency.setValueAtTime(320, now);
       osc.frequency.linearRampToValueAtTime(880, now + 0.25);
       gain.gain.setValueAtTime(0.15, now);
       gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
       osc.start(now); osc.stop(now + 0.25);
     } else if (type === 'eatGhost') {
       osc.type = 'square';
       osc.frequency.setValueAtTime(500, now);
       osc.frequency.setValueAtTime(1000, now + 0.1);
       gain.gain.setValueAtTime(0.15, now);
       gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
       osc.start(now); osc.stop(now + 0.2);
     } else if (type === 'die') {
       osc.type = 'sawtooth';
       osc.frequency.setValueAtTime(300, now);
       osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
       gain.gain.setValueAtTime(0.2, now);
       gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
       osc.start(now); osc.stop(now + 0.4);
     }
   } catch (e) {}
 }

 function getTunnelRow() {
   const cfg = MAP_CONFIGS[selectedMapType] || MAP_CONFIGS.hard;

 function canMove(gx, gy, direction) {
   let nx = gx;
   let ny = gy;
   if (direction === DIR.RIGHT) nx += 1;
   else if (direction === DIR.LEFT) nx -= 1;
   else if (direction === DIR.UP) ny -= 1;
   else if (direction === DIR.DOWN) ny += 1;

   if (ny === getTunnelRow() && (nx < 0 || nx >= COLS)) return true;
   if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;

   return map[ny][nx] !== 1;
 }

 function isOpposite(d1, d2) {
   return (d1 === DIR.LEFT && d2 === DIR.RIGHT) ||
          (d1 === DIR.RIGHT && d2 === DIR.LEFT) ||
          (d1 === DIR.UP && d2 === DIR.DOWN) ||
          (d1 === DIR.DOWN && d2 === DIR.UP);
 }

 function drawMap() {
   ctx.fillStyle = '#050505';
   ctx.fillRect(0, 0, canvas.width, canvas.height);

   for (let r = 0; r < ROWS; r++) {
     for (let c = 0; c < COLS; c++) {
       const tile = map[r][c];
       const x = c * CELL_SIZE;
       const y = r * CELL_SIZE;

       if (tile === 1) {
         drawTentRoofWall(x, y);
       } else if (tile === 2) {
         drawSkewer(ctx, x + CELL_SIZE/2, y + CELL_SIZE/2);
       } else if (tile === 3) {
         drawKachiBag(x + CELL_SIZE/2, y + CELL_SIZE/2);
       }
     }
   }
 }

 class Player {
   constructor(gx, gy) {
     this.startX = gx;
     this.startY = gy;
     this.facingLeft = false;
     this.reset();
   }
   reset() {
     this.x = this.startX * CELL_SIZE + CELL_SIZE / 2;
     this.y = this.startY * CELL_SIZE + CELL_SIZE / 2;
     this.dir = DIR.STOP;
     this.nextDir = DIR.STOP;
     this.speed = 2; 
   }
   get gridX() { return Math.floor(this.x / CELL_SIZE); }
   get gridY() { return Math.floor(this.y / CELL_SIZE); }

   draw() {
     ctx.save();
     ctx.translate(this.x, this.y);

     const isInvincible = powerModeTime > 0;
     const isEnding = powerModeTime <= 120;
     const showGlow = isInvincible && (!isEnding || Math.floor(powerModeTime / 6) % 2 === 0);

     if (showGlow) {
       ctx.save();
       const pulse = 13 + Math.sin(frameCount * 0.35) * 2.5;
       const glowGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, pulse + 6);
       glowGrad.addColorStop(0, 'rgba(255, 238, 88, 0.6)');
       glowGrad.addColorStop(0.6, 'rgba(255, 215, 0, 0.35)');
       glowGrad.addColorStop(1, 'rgba(255, 193, 7, 0)');
       ctx.fillStyle = glowGrad;
       ctx.beginPath();
       ctx.arc(0, 0, pulse + 6, 0, Math.PI * 2);
       ctx.fill();

       ctx.strokeStyle = '#fff176';
       ctx.lineWidth = 2;
       ctx.beginPath();
       ctx.arc(0, 0, pulse, 0, Math.PI * 2);
       ctx.stroke();

       for (let i = 0; i < 3; i++) {
         const a = (frameCount * 0.15) + (i * Math.PI * 2 / 3);
         drawStar(ctx, Math.cos(a) * (pulse + 3), Math.sin(a) * (pulse + 3), 4, 3.8, 1.8, '#fffde7', '#ffd700');
       }
       ctx.restore();
     }

     if (this.dir === DIR.LEFT) this.facingLeft = true;
     if (this.dir === DIR.RIGHT) this.facingLeft = false;
     if (this.facingLeft) ctx.scale(-1, 1);

     const isEatingOpen = (Math.floor(frameCount / 6) % 2 === 0) && (this.dir !== DIR.STOP);
     const mouthLine = isEatingOpen ? '.S.MM..S....' : '..SMMSS.....'; 

     const sprite = [
       '..HHHHH.....', 
       '.HHHHHHH....', 
       '.HHSSSSH....', 
       '..SE.SS.....', 
       '..SSSSSS....', 
       mouthLine, 
       '.SWWWWS.....', 
       '.SWWWWS.....', 
       '..BBBB......', 
       '..SS.SS.....', 
       '..BW.BW.....', 
       '............'
     ];

     const palette = {
       'H': '#1c1c1c', 'S': '#ffcd94', 'E': '#000000',
       'M': '#d32f2f', 'W': '#ffffff', 'B': '#1565c0'
     };

     const scale = 1.35;
     drawPixelSprite(ctx, sprite, palette, scale, - (12 * scale) / 2, - (12 * scale) / 2);
     ctx.restore();
   }

   update() {
     for (let s = 0; s < this.speed; s++) {
       this.step();
       if (gameState !== 'PLAY') return;
     }
   }

   step() {
     if (isOpposite(this.dir, this.nextDir)) {
       this.dir = this.nextDir;
     }

     const atCenterX = (this.x - CELL_SIZE / 2) % CELL_SIZE === 0;
     const atCenterY = (this.y - CELL_SIZE / 2) % CELL_SIZE === 0;

     if (atCenterX && atCenterY) {
       const gx = Math.round((this.x - CELL_SIZE / 2) / CELL_SIZE);
       const gy = Math.round((this.y - CELL_SIZE / 2) / CELL_SIZE);

       if (map[gy] && map[gy][gx] === 2) {
         map[gy][gx] = 0;
         score += 10;
         updateHUD();
         playSound('chomp');
         checkWin();
       } else if (map[gy] && map[gy][gx] === 3) {
         map[gy][gx] = 0;
         const key = `${gy},${gx}`;
         const qIdx = soupQuestionMap[key] !== undefined ? soupQuestionMap[key] : 0;
         delete soupQuestionMap[key];
         triggerQuiz(qIdx);
         return; 
       }

       if (this.nextDir !== DIR.STOP && canMove(gx, gy, this.nextDir)) {
         this.dir = this.nextDir;
       }

       if (!canMove(gx, gy, this.dir)) {
         this.dir = DIR.STOP;
         return;
       }
     }

     if (this.dir === DIR.RIGHT) this.x += 1;
     else if (this.dir === DIR.LEFT) this.x -= 1;
     else if (this.dir === DIR.UP) this.y -= 1;
     else if (this.dir === DIR.DOWN) this.y += 1;

     if (this.x < -CELL_SIZE / 2) this.x = COLS * CELL_SIZE + CELL_SIZE / 2;
     else if (this.x > COLS * CELL_SIZE + CELL_SIZE / 2) this.x = -CELL_SIZE / 2;
   }
 }

 class Ghost {
   constructor(gx, gy, towelColor, propType) {
     this.startX = gx;
     this.startY = gy;
     this.towelColor = towelColor;
     this.propType = propType;
     this.reset();
   }
   reset() {
     this.x = this.startX * CELL_SIZE + CELL_SIZE / 2;
     this.y = this.startY * CELL_SIZE + CELL_SIZE / 2;
     this.dir = DIR.UP;
     this.state = (powerModeTime > 0) ? 'SCARED' : 'NORMAL'; 
   }
   get gridX() { return Math.floor(this.x / CELL_SIZE); }
   get gridY() { return Math.floor(this.y / CELL_SIZE); }

   draw() {
     ctx.save();
     const wobble = (this.dir !== DIR.STOP) ? Math.sin(frameCount * 0.25 + this.propType) * 1.5 : 0;
     ctx.translate(this.x, this.y + wobble);

     if (this.dir === DIR.LEFT) ctx.scale(-1, 1);

     const isScared = this.state === 'SCARED';

     const sprite = [
       '...SSS......',
       '.GGSSSSGG...',
       'G..E..E.G...',
       '...SSSS.....',
       '..SBBBB.....',
       '.T.VVVV.T...',
       '.T.VVVV.T...',
       '..KKKK......',
       '..SS.SS.....',
       '..BW.BW.....',
       '............',
       '............'
     ];
     const palette = {
       'S': '#f5cba7',
       'G': '#cfd8dc',
       'E': '#000000',
       'B': '#1565c0',
       'T': this.towelColor,
       'V': '#ffffff',
       'K': '#8d6e63',
       'W': '#ffffff'
     };

     const scale = 1.35;
     drawPixelSprite(ctx, sprite, palette, scale, - (12 * scale) / 2, - (12 * scale) / 2);

     if (isScared) {
       ctx.fillStyle = '#40c4ff';
       ctx.fillRect(6, -8, 2, 3);
       ctx.fillRect(7, -7, 2, 2);
     }

     ctx.restore();
   }

   update() {
     let steps = (this.state === 'SCARED') ? ((frameCount % 4 === 0) ? 1 : 0) : ((frameCount % 8 === 0) ? 0 : 1);
     for (let s = 0; s < steps; s++) {
       this.step();
     }
   }

   step() {
     const atCenterX = (this.x - CELL_SIZE / 2) % CELL_SIZE === 0;
     const atCenterY = (this.y - CELL_SIZE / 2) % CELL_SIZE === 0;

     if (atCenterX && atCenterY) {
       const gx = Math.round((this.x - CELL_SIZE / 2) / CELL_SIZE);
       const gy = Math.round((this.y - CELL_SIZE / 2) / CELL_SIZE);

       this.chooseDirection(gx, gy);

       if (!canMove(gx, gy, this.dir)) {
         this.dir = DIR.STOP;
         return;
       }
     }

     if (this.dir === DIR.RIGHT) this.x += 1;
     else if (this.dir === DIR.LEFT) this.x -= 1;
     else if (this.dir === DIR.UP) this.y -= 1;
     else if (this.dir === DIR.DOWN) this.y += 1;

     if (this.x < -CELL_SIZE / 2) this.x = COLS * CELL_SIZE + CELL_SIZE / 2;
     else if (this.x > COLS * CELL_SIZE + CELL_SIZE / 2) this.x = -CELL_SIZE / 2;
   }

   chooseDirection(gx, gy) {
     const allDirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
     let validDirs = [];

     for (let d of allDirs) {
       if (isOpposite(d, this.dir)) continue;
       if (canMove(gx, gy, d)) validDirs.push(d);
     }

     if (validDirs.length === 0) {
       for (let d of allDirs) {
         if (canMove(gx, gy, d)) validDirs.push(d);
       }
     }

     if (validDirs.length > 0) {
       if (this.state === 'SCARED' || Math.random() < 0.45) {
         this.dir = validDirs[Math.floor(Math.random() * validDirs.length)];
       } else {
         let bestDir = validDirs[0];
         let minDist = Infinity;
         for (let d of validDirs) {
           let tx = gx + (d === DIR.RIGHT ? 1 : d === DIR.LEFT ? -1 : 0);
           let ty = gy + (d === DIR.DOWN ? 1 : d === DIR.UP ? -1 : 0);
           let dist = Math.hypot(tx - player.gridX, ty - player.gridY);
           if (dist < minDist) {
             minDist = dist;
             bestDir = d;
           }
         }
         this.dir = bestDir;
       }
     }
   }
 }

 function runCountdown(onComplete) {
   if (countdownTimer) {
     clearTimeout(countdownTimer);
     countdownTimer = null;
   }

   gameState = 'COUNTDOWN';
   const overlay = document.getElementById('countdown-overlay');
   const textEl = document.getElementById('countdown-text');
   overlay.classList.remove('hidden');

   drawMap();
   player.draw();
   ghosts.forEach(g => g.draw());

   let count = 3;

   function step() {
     if (gameState !== 'COUNTDOWN') return;

     drawMap();
     player.draw();
     ghosts.forEach(g => g.draw());

     if (count > 0) {
       textEl.innerText = count;
       textEl.style.color = count === 1 ? 'var(--neon-pink)' : (count === 2 ? 'var(--neon-yellow)' : 'var(--neon-blue)');
       textEl.style.animation = 'none';
       void textEl.offsetWidth; 
       textEl.style.animation = 'countZoom 0.95s cubic-bezier(0.25, 1, 0.5, 1) forwards';
       playSound('beep');
       count--;
       countdownTimer = setTimeout(step, 1000);
     } else if (count === 0) {
       textEl.innerText = "出發！";
       textEl.style.color = "var(--neon-green)";
       textEl.style.animation = 'none';
       void textEl.offsetWidth;
       textEl.style.animation = 'countZoom 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards';
       playSound('start');
       count--;
       countdownTimer = setTimeout(() => {
         overlay.classList.add('hidden');
         if (gameState === 'COUNTDOWN') onComplete();
       }, 800);
     }
   }
   step();
 }

 let touchStartX = 0, touchStartY = 0;
 window.addEventListener('touchstart', e => {
   if (e.changedTouches && e.changedTouches.length > 0) {
     touchStartX = e.changedTouches[0].clientX;
     touchStartY = e.changedTouches[0].clientY;
   }
 }, { passive: true });

 window.addEventListener('touchend', e => {
   if ((gameState !== 'PLAY' && gameState !== 'COUNTDOWN') || !e.changedTouches || e.changedTouches.length === 0) return;
   let dx = e.changedTouches[0].clientX - touchStartX;
   let dy = e.changedTouches[0].clientY - touchStartY;
   if (Math.abs(dx) > Math.abs(dy)) {
     if (dx > 20) player.nextDir = DIR.RIGHT;
     else if (dx < -20) player.nextDir = DIR.LEFT;
   } else { 
     if (dy > 20) player.nextDir = DIR.DOWN;
     else if (dy < -20) player.nextDir = DIR.UP;
   }
 }, { passive: true });

 function handleQuizAnswer(selectedIndex, btnElement) {
   const btns = document.querySelectorAll('.quiz-btn');
   btns.forEach(b => b.disabled = true);

   const feedback = document.getElementById('quiz-feedback');
   const title = document.getElementById('quiz-title');
   const continueBtn = document.getElementById('quiz-continue-btn');

   continueBtn.classList.remove('hidden');

   const correctOpt = currentQuiz.options[currentQuiz.ans];
   const correctText = typeof correctOpt === 'string' ? correctOpt : correctOpt.text;

   if (selectedIndex === currentQuiz.ans) {
     title.innerText = "回答正確！能量爆發！";
     title.style.color = "var(--neon-blue)";
     feedback.innerHTML = "<span style='color:var(--neon-blue)'>答對了！老伯嚇得直冒冷汗，快追！</span><br><span style='color:#aaaaaa'>(2 秒後自動返回...)</span>";
     btnElement.style.background = "var(--neon-blue)";
     btnElement.style.color = "#000000";

     powerModeTime = 450; 
     ghosts.forEach(g => g.state = 'SCARED');
     playSound('power');

     quizTimer = setTimeout(() => resumeGame(), 2000);
   } else {
     title.innerText = "答錯囉！";
     title.style.color = "var(--neon-pink)";
     feedback.innerHTML = `<span style='color:var(--neon-pink)'>正確答案是：【${correctText}】</span><br><span style='color:#aaaaaa'>能量被沒收了...(2.5 秒後自動返回...)</span>`;
     btnElement.style.background = "var(--neon-pink)";
     btnElement.style.color = "#ffffff";

     btns[currentQuiz.ans].style.borderColor = "var(--neon-blue)";
     btns[currentQuiz.ans].style.boxShadow = "0 0 10px var(--neon-blue) inset";
     playSound('die');

     quizTimer = setTimeout(() => resumeGame(), 2500);
   }
 }

 function gameLoop() {
   if (gameState !== 'PLAY') return;
   frameCount++;

   player.update();
   if (gameState !== 'PLAY') return;

   ghosts.forEach(g => g.update());

   if (powerModeTime > 0) {
     powerModeTime--;
     if (powerModeTime === 0) ghosts.forEach(g => g.state = 'NORMAL');
   }

   const hitDistance = CELL_SIZE * 0.75;
   for (let g of ghosts) {
     let dist = Math.hypot(player.x - g.x, player.y - g.y);
     if (dist < hitDistance) {
       if (powerModeTime > 0 || g.state === 'SCARED') {
         score += 50;
         updateHUD();
         playSound('eatGhost');
         g.reset(); 
       } else {
         handleDeath();
         return;
       }
     }
   }

   drawMap();
   player.draw();
   ghosts.forEach(g => g.draw());

   animationId = requestAnimationFrame(gameLoop);
 }

 function handleDeath() {
   gameState = 'PAUSE';
   playSound('die');
   lives--;
   updateHUD();
   
   if (lives > 0) {
     setTimeout(() => {
       resetAllPositions();
       drawMap();
       player.draw();
       ghosts.forEach(g => g.draw());
       runCountdown(() => {
         gameState = 'PLAY';
         gameLoop();
       });
     }, 800);
   } else {
     gameState = 'GAMEOVER';
     pauseBGM();
     saveScoreToLeaderboard(playerName, score); // 🌟 結算成績寫入排行榜
     setTimeout(() => {
       document.getElementById('end-title').innerText = "Game Over";
       document.getElementById('end-message').innerText = "肚子撐破啦！被熱情老伯抓到了！";
       document.getElementById('final-score').innerText = score;
       const badge = document.getElementById('score-rank-badge');
       if (badge) {
         if (score >= 1200) badge.innerText = "🌟 傳奇夜市食神 🌟";
         else if (score >= 800) badge.innerText = "🏆 頂級夜市大胃王 🏆";
         else if (score >= 400) badge.innerText = "✨ 熟門熟路老饕 ✨";
         else badge.innerText = "🥢 夜市吃貨新手 🥢";
       }
       document.getElementById('game-over-screen').classList.remove('hidden');
     }, 800);
   }
 }

 function checkWin() {
   let hasFood = false;
   for (let r = 0; r < ROWS; r++) {
     for (let c = 0; c < COLS; c++) {
       if (map[r][c] === 2 || map[r][c] === 3) hasFood = true;
     }
   }
   if (!hasFood) {
     gameState = 'VICTORY';
     pauseBGM();
     saveScoreToLeaderboard(playerName, score); // 🌟 通關成績寫入排行榜
     document.getElementById('end-title').innerText = "通關大吉！";
     document.getElementById('end-title').style.color = "var(--neon-blue)";
     document.getElementById('end-message').innerText = "太厲害了！你搜集了整座夜市的美食與茄芷袋！";
     document.getElementById('final-score').innerText = score;
     document.getElementById('game-over-screen').classList.remove('hidden');
     return true;
   }
   return false;
 }

 function initApp() {
   map = buildDynamicMap();
   initGhostTeam();
   resetAllPositions();
   drawMap();
 }

 window.addEventListener('resize', () => {
   updateContainerLayout();
   if (gameState !== 'PLAY') {
     drawMap();
     player.draw();
     ghosts.forEach(g => g.draw());
   }
 });

 if (document.readyState === 'loading') {
   document.addEventListener('DOMContentLoaded', initApp);
 } else {
   initApp();
 }
 </script>
</body>
</html>
